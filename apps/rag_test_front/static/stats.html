<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>헤어스타일 RAG 데이터 통계</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ── 레이아웃 ── */
    .stats-header {
      background: #1c1c1e;
      color: #f2f2f7;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .stats-header h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }
    .back-link { color: #64d2ff; font-size: 0.82rem; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }

    .stats-main {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stats-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .stats-card h2 {
      font-size: 0.92rem;
      font-weight: 700;
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e5e5ea;
      color: #1c1c1e;
    }

    /* ── 요약 카드 ── */
    .summary-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .sum-item {
      flex: 1;
      min-width: 120px;
      background: #f9f9fb;
      border: 1px solid #e5e5ea;
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sum-value {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .sum-label {
      font-size: 0.72rem;
      color: #636366;
      margin-top: 2px;
    }
    .sum-item.s-total  .sum-value { color: #007aff; }
    .sum-item.s-rec    .sum-value { color: #34c759; }
    .sum-item.s-notrec .sum-value { color: #ff3b30; }
    .sum-item.s-review .sum-value { color: #ff9500; }
    .sum-item.s-reason .sum-value { color: #b8860b; }

    /* ── 필터 행 ── */
    .filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .filter-row label { font-size: 0.78rem; font-weight: 600; color: #636366; }
    .filter-row select {
      padding: 5px 10px;
      border: 1px solid #d1d1d6;
      border-radius: 8px;
      font-size: 0.82rem;
      background: #fff;
      cursor: pointer;
    }

    /* ── 테이블 ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead th {
      background: #f2f2f7;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      color: #636366;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    tbody td {
      padding: 7px 12px;
      color: #1c1c1e;
      border-bottom: 1px solid #f2f2f7;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) { background: #f9f9fb; }
    tbody tr:hover { background: #f0f4ff; }
    tbody tr.row-unreg td { color: #aeaeb2; }

    /* ── 뱃지 ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge.male   { background: #e3f0ff; color: #0071e3; }
    .badge.female { background: #ffeaf2; color: #c0392b; }
    .badge.unreg  { background: #f2f2f7; color: #aeaeb2; font-style: italic; }

    .code-cell { font-family: "SF Mono", "Menlo", monospace; font-size: 0.75rem; color: #636366; }

    .num-rec    { color: #34c759; font-weight: 600; }
    .num-notrec { color: #ff3b30; font-weight: 600; }
    .num-review { color: #ff9500; font-weight: 600; }
    .num-reason { color: #b8860b; font-weight: 600; }

    /* ── 부족 데이터 목록 ── */
    .missing-section { margin-bottom: 18px; }
    .missing-section h3 {
      font-size: 0.82rem;
      font-weight: 700;
      margin: 0 0 8px;
      color: #3a3a3c;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
    }
    .tag.missing     { background: #fff0ef; border: 1px solid #ffb3ae; color: #c0392b; }
    .tag.insufficient{ background: #fff8ec; border: 1px solid #ffd094; color: #7c5600; }
    .tag.style-miss  { background: #f0f0ff; border: 1px solid #c5c0ff; color: #4b44c5; }
    .tag-count { font-weight: 700; margin-right: 3px; }

    .no-data-msg { color: #aeaeb2; font-size: 0.82rem; padding: 8px 0; }

    #loading-msg { color: #636366; font-size: 0.85rem; padding: 24px 0; text-align: center; }
    #stats-error { color: #c0392b; padding: 12px; font-size: 0.85rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header class="stats-header">
    <h1>헤어스타일 RAG 데이터 통계 <span class="dev-badge">개발 확인용</span></h1>
    <a href="/" class="back-link">&larr; 메인 테스트 페이지</a>
  </header>

  <div class="stats-main">

    <div id="loading-msg">데이터 불러오는 중...</div>
    <div id="stats-error" class="hidden"></div>

    <!-- ① 전체 요약 -->
    <div class="stats-card hidden" id="card-summary">
      <h2>전체 요약</h2>
      <div class="summary-grid">
        <div class="sum-item s-total">
          <span class="sum-value" id="sum-total">-</span>
          <span class="sum-label">전체 데이터</span>
        </div>
        <div class="sum-item s-rec">
          <span class="sum-value" id="sum-rec">-</span>
          <span class="sum-label">추천 데이터</span>
        </div>
        <div class="sum-item s-notrec">
          <span class="sum-value" id="sum-notrec">-</span>
          <span class="sum-label">비추천 데이터</span>
        </div>
        <div class="sum-item s-review">
          <span class="sum-value" id="sum-review">-</span>
          <span class="sum-label">검토 필요</span>
        </div>
        <div class="sum-item s-reason">
          <span class="sum-value" id="sum-reason">-</span>
          <span class="sum-label">사유 보강 필요</span>
        </div>
      </div>
    </div>

    <!-- ② 조건별 데이터 개수 -->
    <div class="stats-card hidden" id="card-condition">
      <h2>조건별 데이터 개수</h2>
      <div class="filter-row">
        <label for="cond-gender">성별:</label>
        <select id="cond-gender">
          <option value="all">전체</option>
          <option value="여성">여성</option>
          <option value="남성">남성</option>
        </select>
        <label for="cond-shape">얼굴형:</label>
        <select id="cond-shape">
          <option value="all">전체</option>
        </select>
        <label for="cond-prop">삼정 비율:</label>
        <select id="cond-prop">
          <option value="all">전체</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>성별</th>
              <th>얼굴형</th>
              <th>삼정 비율</th>
              <th>전체</th>
              <th>추천</th>
              <th>비추천</th>
              <th>검토 필요</th>
              <th>사유 보강</th>
            </tr>
          </thead>
          <tbody id="cond-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ③ 스타일별 등록 현황 -->
    <div class="stats-card hidden" id="card-style">
      <h2>스타일별 등록 현황</h2>
      <div class="filter-row">
        <label for="style-gender">성별:</label>
        <select id="style-gender">
          <option value="all">전체</option>
          <option value="여성">여성</option>
          <option value="남성">남성</option>
        </select>
        <span style="font-size:0.75rem;color:#aeaeb2;margin-left:4px;">회색 행 = 마스터에 있으나 DB 미등록 스타일</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>성별</th>
              <th>코드</th>
              <th>스타일명</th>
              <th>전체</th>
              <th>추천</th>
              <th>비추천</th>
              <th>검토 필요</th>
              <th>사유 보강</th>
            </tr>
          </thead>
          <tbody id="style-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- ④ 부족 데이터 목록 -->
    <div class="stats-card hidden" id="card-missing">
      <h2>부족 데이터 목록</h2>

      <div class="missing-section">
        <h3>미등록 조합 <span id="cnt-missing-cond" style="color:#ff3b30;"></span></h3>
        <div class="tag-list" id="list-missing-cond"></div>
      </div>

      <div class="missing-section">
        <h3>부족 조합 (1~4건) <span id="cnt-insuf-cond" style="color:#ff9500;"></span></h3>
        <div class="tag-list" id="list-insuf-cond"></div>
      </div>

      <div class="missing-section">
        <h3>미등록 스타일 <span id="cnt-missing-style" style="color:#4b44c5;"></span></h3>
        <div class="tag-list" id="list-missing-style"></div>
      </div>
    </div>

  </div>

  <script src="/static/stats.js"></script>
</body>
</html>
